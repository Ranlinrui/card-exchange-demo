<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家核款 · 卡密服务</title><link rel="stylesheet" href="/styles.css"><script defer src="/app.js"></script></head><body data-page="merchant"><header><nav class="nav" aria-label="主导航"><a class="brand" href="/">卡密服务</a><div class="links"><a href="/">购买商品</a><a href="/track">凭码查单</a><a href="/merchant" aria-current="page">商家入口</a></div></nav></header><main><div class="intro"><h1>商家核款与订单</h1><p class="muted">先在自己的收款渠道核实到账，再确认采购。客户申报不代表到账。</p></div><section class="card narrow" id="login-panel"><h2>商家登录</h2><form id="login-form"><label for="merchant-password">管理密码</label><input type="password" id="merchant-password" autocomplete="current-password" required maxlength="200"><div class="actions"><button class="primary" id="login" type="submit">登录</button></div></form></section><section class="card" id="merchant-panel" hidden><div class="toolbar"><h2>本店订单</h2><div class="actions"><button id="refresh-orders">刷新列表</button><button id="logout">退出登录</button></div></div><div class="notice warning">请以真实收款记录为准。未知结果只能查询原订单，不要重复采购。</div><div id="merchant-orders" class="order-list list-spaced"></div></section><p class="message" id="merchant-message" role="status" aria-live="polite"></p><dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">核实真实到账</h2><div id="confirm-summary"></div><p class="notice warning">请打开自己的收款记录核对。以下确认会触发该订单采购。</p><form id="confirm-form"><label for="received-amount">实际到账金额（元）</label><input id="received-amount" inputmode="decimal" placeholder="手动输入到账金额，例如 12.00" autocomplete="off" required><label class="check"><input id="received-check" type="checkbox" required><span>我已查看真实收款记录，确认本单款项实际到账。</span></label><div class="actions"><button id="confirm-received" class="primary" type="submit">确认到账并采购</button><button id="cancel-confirm" type="button">取消</button></div><p class="message" id="confirm-message" role="status" aria-live="polite"></p></form></dialog></main><footer>登录状态由本地服务维护；退出后清除页面订单数据。</footer></body></html>
