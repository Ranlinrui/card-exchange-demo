<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凭码查单 · 卡密服务</title><link rel="stylesheet" href="/styles.css"><script defer src="/totp.js"></script><script defer src="/app.js"></script></head><body data-page="track"><header><nav class="nav" aria-label="主导航"><a class="brand" href="/">卡密服务</a><div class="links"><a href="/">购买商品</a><a href="/track" aria-current="page">凭码查单</a><a href="/merchant">商家入口</a></div></nav></header><main class="narrow"><div class="intro"><h1>凭订单号与查询码查单</h1><p class="muted">查询码只对应一张订单，请使用下单时保存的内容。</p></div><section class="card"><form id="lookup-form"><label for="order-id">订单号</label><input id="order-id" required maxlength="100" autocomplete="off" spellcheck="false"><label for="lookup-code">查询码</label><input id="lookup-code" type="password" required maxlength="200" autocomplete="off" spellcheck="false"><div class="actions"><button class="primary" id="lookup" type="submit">查询订单</button><button id="clear-identity" type="button">清除本页信息</button></div></form><p class="help">订单与交付信息只留在本页内存。切换查单身份、隐藏页面或离开时，会清除已显示的账号与验证码。</p><p id="lookup-message" class="message" role="status" aria-live="polite"></p></section><section class="card" id="order-result" hidden><h2>本单进度</h2><div id="order-summary"></div><div id="delivery"></div></section></main><footer>处理中每 5 秒自动查询一次，最多 12 次；超时后可手动查询。未知结果请联系商家核查原单。</footer></body></html>
